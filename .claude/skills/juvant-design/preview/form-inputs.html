<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div style="display:flex; gap:14px; align-items:flex-start;">
    <label style="flex:1;display:flex;flex-direction:column;gap:6px;">
      <span class="label">EMAIL</span>
      <input type="email" value="hello@juvant.io" style="font-family:var(--font-sans);font-size:14px;padding:11px 14px;background:#161D2C;border:1px solid rgba(232,238,250,0.1);border-radius:8px;color:#E8EEFA;outline:none;"/>
    </label>
    <label style="flex:1;display:flex;flex-direction:column;gap:6px;">
      <span class="label">INSTITUTION</span>
      <select style="font-family:var(--font-sans);font-size:14px;padding:11px 14px;background:#161D2C;border:1px solid rgba(232,238,250,0.1);border-radius:8px;color:#E8EEFA;outline:none;">
        <option>Università Bocconi</option>
      </select>
    </label>
  </div>
  <div style="display:flex;gap:18px;align-items:center;margin-top:16px;">
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#E8EEFA;">
      <span style="width:16px;height:16px;border-radius:4px;background:linear-gradient(135deg,#A855F7,#22D3EE);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#fff;">✓</span>
      I teach in higher ed
    </label>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#94A3B8;">
      <span style="width:16px;height:16px;border-radius:999px;border:2px solid rgba(168,85,247,0.8);display:inline-flex;align-items:center;justify-content:center;"><span style="width:6px;height:6px;border-radius:999px;background:#A855F7;"></span></span>
      Program director
    </label>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#94A3B8;">
      <span style="width:28px;height:16px;border-radius:999px;background:linear-gradient(90deg,#A855F7,#22D3EE);position:relative;"><span style="position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:999px;background:#fff;"></span></span>
      Notify me
    </label>
  </div>
</body></html>
