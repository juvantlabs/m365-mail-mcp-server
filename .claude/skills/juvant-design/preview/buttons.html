<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap;">
    <button style="font-family:var(--font-sans);font-weight:600;font-size:14px;padding:12px 24px;border:0;border-radius:8px;background:linear-gradient(90deg,#A855F7,#22D3EE);color:#fff;cursor:pointer;">Talk to us →</button>

    <button style="font-family:var(--font-sans);font-weight:600;font-size:14px;padding:11px 23px;border-radius:8px;color:#E8EEFA;background:transparent;border:1px solid transparent;background-image:linear-gradient(#080B14,#080B14),linear-gradient(90deg,#A855F7,#22D3EE);background-origin:border-box;background-clip:padding-box,border-box;cursor:pointer;">See the approach</button>

    <button style="font-family:var(--font-sans);font-weight:600;font-size:14px;padding:11px 23px;border-radius:8px;color:#E8EEFA;background:transparent;border:1px solid rgba(232,238,250,0.12);cursor:pointer;">Read the paper</button>

    <button disabled style="font-family:var(--font-sans);font-weight:600;font-size:14px;padding:12px 24px;border:0;border-radius:8px;background:linear-gradient(90deg,#A855F7,#22D3EE);color:#fff;opacity:0.4;cursor:not-allowed;">Disabled</button>
  </div>
  <div class="label" style="margin-top:14px;">BUTTONS · primary (gradient) · outline (gradient border) · ghost · disabled</div>
</body></html>
