<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:0;width:700px;margin:0;">
  <div style="display:flex;">
    <div style="background:#080B14;padding:22px;flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:110px;">
      <img src="../assets/juvant/juvant-logo-dark.png" style="height:40px;width:auto;display:block;"/>
      <div style="color:#94A3B8;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;margin-top:14px;">Dark card · default</div>
    </div>
    <div style="background:#F4F6FB;padding:22px;flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:110px;border-left:1px solid rgba(13,17,23,0.06);border-right:1px solid rgba(13,17,23,0.06);">
      <img src="../assets/juvant/juvant-logo-transparent.png" style="height:40px;width:auto;display:block;"/>
      <div style="color:#6b7280;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;margin-top:14px;">Transparent · on light</div>
    </div>
    <div style="background:linear-gradient(135deg,#3b1d6b 0%,#0a2a3a 100%);padding:22px;flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:110px;">
      <img src="../assets/juvant/juvant-logo-white.png" style="height:40px;width:auto;display:block;border-radius:4px;"/>
      <div style="color:#ffffff;opacity:0.78;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;margin-top:14px;">White-bg · on dark/gradient</div>
    </div>
  </div>
</body></html>
