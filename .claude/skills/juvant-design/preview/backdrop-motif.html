<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:#080B14;padding:0;overflow:hidden;">
  <svg width="700" height="180" viewBox="0 0 700 180" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="g1" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="g2" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
      </radialGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="2"/></filter>
    </defs>
    <rect width="700" height="180" fill="#080B14"/>
    <circle cx="150" cy="90" r="120" fill="url(#g1)"/>
    <circle cx="550" cy="110" r="140" fill="url(#g2)"/>
    <!-- Ambient dot field -->
    <g opacity="0.55">
      <circle cx="80" cy="40" r="1.2" fill="#A855F7"/>
      <circle cx="120" cy="120" r="1" fill="#22D3EE"/>
      <circle cx="220" cy="60" r="1.4" fill="#A855F7"/>
      <circle cx="260" cy="140" r="1" fill="#E8EEFA" opacity=".5"/>
      <circle cx="360" cy="30" r="1.2" fill="#22D3EE"/>
      <circle cx="400" cy="100" r="1" fill="#A855F7"/>
      <circle cx="470" cy="50" r="1.4" fill="#22D3EE"/>
      <circle cx="510" cy="140" r="1" fill="#E8EEFA" opacity=".4"/>
      <circle cx="590" cy="60" r="1.2" fill="#A855F7"/>
      <circle cx="630" cy="130" r="1.4" fill="#22D3EE"/>

      <circle cx="40" cy="100" r="1" fill="#22D3EE"/>
      <circle cx="310" cy="160" r="1.2" fill="#A855F7"/>
    </g>
    <!-- Central node -->
    <g filter="url(#glow)">
      <circle cx="350" cy="90" r="14" fill="#22D3EE" opacity="0.4"/>
    </g>
    <circle cx="350" cy="90" r="5" fill="#ffffff"/>
    <circle cx="350" cy="90" r="11" fill="none" stroke="#A855F7" stroke-opacity="0.55" stroke-width="1"/>
    <!-- Arcs -->
    <path d="M 200,130 Q 350,-10 500,130" stroke="#A855F7" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M 200,130 Q 350,50 500,130" stroke="#22D3EE" stroke-width="1" fill="none" opacity="0.5"/>
    <circle cx="200" cy="130" r="3.5" fill="#A855F7"/>
    <circle cx="500" cy="130" r="3.5" fill="#22D3EE"/>
  </svg>
  <div style="padding:12px 20px;color:#94A3B8;font-size:11px;font-family:var(--font-sans);">
    Ambient dot field · arcs · converging node · signature backdrop for hero + title surfaces.
  </div>
</body></html>
