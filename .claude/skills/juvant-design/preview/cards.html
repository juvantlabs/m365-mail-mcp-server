<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card {
    background:#161D2C; border:1px solid rgba(232,238,250,0.08);
    border-radius:12px; padding:20px; flex:1;
  }
  .eyebrow { font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:#A855F7;font-weight:600; }
</style>
</head>
<body>
  <div style="display:flex; gap:14px;">
    <div class="card">
      <div class="eyebrow">THE ROOM</div>
      <div style="font-family:var(--font-display);font-size:22px;line-height:1.15;margin-top:10px;color:#E8EEFA;">Directly with students.</div>
      <div style="font-size:13px;line-height:1.55;color:#94A3B8;margin-top:8px;">Precise, patient, and never tired.</div>
      <div style="height:1px;background:linear-gradient(90deg,rgba(168,85,247,0.4),rgba(34,211,238,0.4));margin-top:16px;"></div>
      <div style="display:flex;justify-content:space-between;margin-top:12px;font-size:12px;color:#94A3B8;font-family:var(--font-mono);">
        <span>24 active sessions</span><span>→</span>
      </div>
    </div>
    <div class="card" style="background:#ffffff;border-color:rgba(13,17,23,0.06);box-shadow:0 4px 12px rgba(8,11,20,0.08);">
      <div class="eyebrow">THE MIRROR</div>
      <div style="font-family:var(--font-display);font-size:22px;line-height:1.15;margin-top:10px;color:#0D1117;">What you cannot see.</div>
      <div style="font-size:13px;line-height:1.55;color:#6b7280;margin-top:8px;">Real-time teaching intelligence.</div>
      <div style="height:1px;background:linear-gradient(90deg,rgba(168,85,247,0.4),rgba(34,211,238,0.4));margin-top:16px;"></div>
      <div style="display:flex;justify-content:space-between;margin-top:12px;font-size:12px;color:#6b7280;font-family:var(--font-mono);">
        <span>87% engaged</span><span>→</span>
      </div>
    </div>
  </div>
</body></html>
