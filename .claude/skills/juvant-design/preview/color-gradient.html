<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grad-row { display:flex; flex-direction:column; gap:14px; }
  .grad {
    height:48px; border-radius:10px; position:relative;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .stops { display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:10px; opacity:.85; }
  .caption { font-size: 11px; color: var(--fg-2); display:flex; justify-content:space-between; align-items:center; }
  .hairline { height:1px; background: linear-gradient(90deg, rgba(168,85,247,0.5), rgba(34,211,238,0.5)); }
</style>
</head>
<body>
  <div class="grad-row">
    <div>
      <div class="caption"><span>Text gradient · 90°</span><span class="mono" style="color:var(--fg-2);">linear-gradient(90deg, #A855F7, #22D3EE)</span></div>
      <div class="grad" style="background: linear-gradient(90deg, #A855F7 0%, #22D3EE 100%); margin-top:6px;"></div>
    </div>
    <div>
      <div class="caption"><span>Symbol gradient · 135°</span><span class="mono" style="color:var(--fg-2);">linear-gradient(135deg, #A855F7, #22D3EE)</span></div>
      <div class="grad" style="background: linear-gradient(135deg, #A855F7 0%, #22D3EE 100%); margin-top:6px;"></div>
    </div>
    <div>
      <div class="caption"><span>Hairline separator · 1px · 40%</span><span class="mono" style="color:var(--fg-2);">height: 1px</span></div>
      <div class="hairline" style="margin-top:10px;"></div>
    </div>
  </div>
</body></html>
