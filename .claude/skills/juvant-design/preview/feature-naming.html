<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  :root { color-scheme: dark; }
  body { background: #080B14; }
  .row { display:flex; gap:14px; align-items:stretch; }
  .tile {
    flex:1; background: linear-gradient(135deg, rgba(168,85,247,0.08), rgba(34,211,238,0.04));
    border: 1px solid rgba(232,238,250,0.06);
    border-radius: 10px; padding: 14px;
  }
  .tile .name { font-family: var(--font-display); font-size: 18px; color:#E8EEFA; line-height:1.2; }
  .tile .meaning { font-size: 11px; color:#94A3B8; margin-top:6px; line-height:1.45; }
</style>
</head>
<body>
  <div class="row">
    <div class="tile"><div class="name">The Room</div><div class="meaning">Virtual classroom · where Hardys operates</div></div>
    <div class="tile"><div class="name">The Thread</div><div class="meaning">Longitudinal learning memory</div></div>
    <div class="tile"><div class="name">The Mirror</div><div class="meaning">Real-time faculty analytics</div></div>
  </div>
  <div class="row" style="margin-top:10px;">
    <div class="tile"><div class="name">The Lens</div><div class="meaning">Institutional dashboard</div></div>
    <div class="tile"><div class="name">The Bridge</div><div class="meaning">Guest-speaker integration</div></div>
    <div class="tile"><div class="name">The Folio</div><div class="meaning">Evolving student portrait</div></div>
  </div>
</body></html>
