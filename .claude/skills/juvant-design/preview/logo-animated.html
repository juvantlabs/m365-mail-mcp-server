<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  /* DejaVu Sans Condensed Bold — official brand wordmark font.
     Loaded locally from the project's fonts/ directory (no CDN dependency). */
  @font-face {
    font-family: 'DejaVu Sans Condensed';
    font-weight: 700;
    font-style: normal;
    font-display: swap;
    src: url('../fonts/DejaVuSansCondensed-Bold.ttf') format('truetype');
  }
  body { background:#080B14; padding:24px; margin:0; font-family: Arial, Helvetica, sans-serif; }
  .wrap { display:flex; align-items:center; gap:22px; }
  .logo-holder { width: 300px; flex-shrink: 0; }
  .logo-holder svg { display:block; width:100%; height:auto; }
  .desc-title { font-family: Georgia, serif; font-size: 18px; color:#E8EEFA; line-height:1.2; font-weight: 400; }
  .desc-body { color:#94A3B8; font-size:11.5px; margin-top:6px; line-height:1.55; }
  .desc-body strong { color:#E8EEFA; font-weight:600; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo-holder">
      <!-- SVG inlined so @font-face (DejaVu Sans Condensed Bold) applies to the <text> wordmark.
           When loaded via <img>/<object>, outer fonts don't cross the boundary. -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="100%" height="auto" overflow="hidden">
        <defs>
          <linearGradient id="p-tg" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#A855F7"/>
            <stop offset="100%" stop-color="#22D3EE"/>
          </linearGradient>
          <linearGradient id="p-sg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#A855F7"/>
            <stop offset="100%" stop-color="#22D3EE"/>
          </linearGradient>
          <radialGradient id="p-rg" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#22D3EE"/>
            <stop offset="100%" stop-color="#A855F7"/>
          </radialGradient>
          <filter id="p-glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="p-softglow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="p-bloom" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="40" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <rect width="600" height="150" fill="#080B14" rx="12"/>
        <ellipse cx="90" cy="75" rx="100" ry="85" fill="#A855F7" opacity="0.07" filter="url(#p-bloom)"/>
        <g transform="translate(36, 21) scale(1.2)">
          <circle cx="45" cy="45" r="35" fill="none" stroke="url(#p-sg)" stroke-width="1.5" opacity="0.4"/>
          <circle cx="45" cy="45" r="22" fill="none" stroke="#A855F7" stroke-width="1" opacity="0.2" stroke-dasharray="4 3">
            <animateTransform attributeName="transform" type="rotate" from="0 45 45" to="360 45 45" dur="18s" repeatCount="indefinite"/>
          </circle>
          <circle cx="45" cy="45" r="12" fill="#A855F7" opacity="0.15">
            <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
          </circle>
          <circle cx="45" cy="45" r="12" fill="none" stroke="url(#p-sg)" stroke-width="2.5" filter="url(#p-softglow)"/>
          <circle cx="45" cy="45" r="5" fill="url(#p-sg)" filter="url(#p-glow)">
            <animate attributeName="r" values="4;6.5;4" dur="2.2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="45" cy="45" r="2.5" fill="#ffffff" opacity="0.95"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0 45 45" to="360 45 45" dur="6s" repeatCount="indefinite"/>
            <circle cx="45" cy="10" r="7" fill="url(#p-rg)" filter="url(#p-glow)">
              <animate attributeName="r" values="6;8.5;6" dur="2s" repeatCount="indefinite"/>
            </circle>
            <circle cx="45" cy="10" r="3" fill="#ffffff" opacity="0.85">
              <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
            </circle>
          </g>
        </g>
        <text x="172" y="107" font-family="'DejaVu Sans Condensed', sans-serif" font-size="88" font-weight="700" letter-spacing="4" fill="url(#p-tg)">HARDYS</text>
      </svg>
    </div>
    <div>
      <div class="desc-title">The orbit is alive.</div>
      <div class="desc-body">
        Ramanujan orbits Hardy on a <strong>6s rotation</strong>, central node pulses at <strong>2s</strong>,
        outer dashed ring drifts at <strong>18s</strong>. Wordmark set in
        <strong>DejaVu Sans Condensed&nbsp;Bold</strong> — the canonical brand wordmark font.
      </div>
    </div>
  </div>
</body></html>
