<svg xmlns="http://www.w3.org/2000/svg" width="600" height="150" overflow="hidden">
  <defs>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A855F7"></stop>
      <stop offset="100%" style="stop-color:#22D3EE"></stop>
    </linearGradient>
    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7"></stop>
      <stop offset="100%" style="stop-color:#22D3EE"></stop>
    </linearGradient>
    <radialGradient id="rg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1"></stop>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="40" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>
  
  <ellipse cx="90" cy="75" rx="100" ry="85" fill="#A855F7" opacity="0.07" filter="url(#bloom)"></ellipse>
  <g transform="translate(36, 21) scale(1.2)">
    
    <circle cx="45" cy="45" r="35" fill="none" stroke="url(#sg)" stroke-width="1.5" opacity="0.4"></circle>
    
    <circle cx="45" cy="45" r="22" fill="none" stroke="#A855F7" stroke-width="1" opacity="0.2" stroke-dasharray="4 3"></circle>
    
    <circle cx="45" cy="45" r="12" fill="#A855F7" opacity="0.15"></circle>
    <circle cx="45" cy="45" r="12" fill="none" stroke="url(#sg)" stroke-width="2.5" filter="url(#softglow)"></circle>
    <circle cx="45" cy="45" r="5" fill="url(#sg)" filter="url(#glow)"></circle>
    <circle cx="45" cy="45" r="2.5" fill="#ffffff" opacity="0.95"></circle>
    
    <g>
      
      <circle cx="45" cy="10" r="7" fill="url(#rg)" filter="url(#glow)"></circle>
      <circle cx="45" cy="10" r="3" fill="#ffffff" opacity="0.85"></circle>
    </g>
  </g>
  <text x="172" y="107" font-family="DejaVu Sans Condensed" font-size="88" font-weight="900" letter-spacing="4" fill="url(#tg)">HARDYS</text>
</svg>