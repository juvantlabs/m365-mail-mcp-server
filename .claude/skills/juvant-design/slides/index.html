<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Juvant slide templates</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: #080B14; color: #E8EEFA; font-family: Arial, sans-serif; overflow: hidden; }
  /* 1280x720 slide canvas scaled to fit viewport */
  .slide-stage {
    position: relative; width: 1280px; height: 720px; transform-origin: top left;
    background: #080B14; overflow: hidden;
  }
  .slide-stage.light { background: #F4F6FB; color: #0D1117; }
  .eyebrow { font: bold 11px Arial, sans-serif; letter-spacing: 4px; color: #A855F7; text-transform: uppercase; }
  .title { font: bold 34px Georgia, serif; line-height: 1.12; color: #E8EEFA; letter-spacing: -0.005em; }
  .light .title { color: #0D1117; }
  .body { font: 14px/1.65 Arial, sans-serif; color: #E8EEFA; }
  .light .body { color: #1f2937; }
  .caption { font: 10px Arial, sans-serif; color: #94A3B8; letter-spacing: 0.04em; }
  .quote { font: italic 22px/1.3 Georgia, serif; color: #E8EEFA; }
  .grad-text { background: linear-gradient(90deg,#A855F7,#22D3EE); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hairline { height: 1px; background: linear-gradient(90deg, rgba(168,85,247,0.5), rgba(34,211,238,0.5)); }

  /* Thumbnail track */
  .track {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; padding: 8px; background: rgba(8,11,20,0.85);
    border: 1px solid rgba(232,238,250,0.08); border-radius: 999px; z-index: 100;
    backdrop-filter: blur(10px);
  }
  .track button { background: transparent; border: 0; padding: 6px 14px;
    color: #94A3B8; cursor: pointer; font: 600 12px var(--font-sans, sans-serif);
    border-radius: 999px; }
  .track button.on { background: linear-gradient(90deg,#A855F7,#22D3EE); color: #fff; }

  .slide-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div class="slide-wrap" id="stage"></div>
<div class="track" id="track"></div>

<script>
  const SLIDES = [
    { id: 'title',   label: 'Title',   render: TitleSlide },
    { id: 'section', label: 'Section', render: SectionSlide },
    { id: 'content', label: 'Content', render: ContentSlide },
    { id: 'quote',   label: 'Quote',   render: QuoteSlide },
    { id: 'compare', label: 'Compare', render: CompareSlide },
    { id: 'closing', label: 'Closing', render: ClosingSlide },
  ];

  function scaleStage() {
    const s = document.querySelector('.slide-stage');
    if (!s) return;
    const sc = Math.min(window.innerWidth / 1280, (window.innerHeight - 80) / 720);
    s.style.transform = `scale(${sc})`;
    s.parentElement.style.width = (1280 * sc) + 'px';
    s.parentElement.style.height = (720 * sc) + 'px';
  }

  function render(id) {
    const slide = SLIDES.find(s => s.id === id) || SLIDES[0];
    const stage = document.getElementById('stage');
    stage.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'slide-stage' + (slide.id === 'content' ? ' light' : '');
    el.setAttribute('data-screen-label', `slide-${slide.id}`);
    el.innerHTML = slide.render();
    stage.appendChild(el);
    localStorage.setItem('juvant-slide', id);
    scaleStage();
    Array.from(document.querySelectorAll('#track button')).forEach(b =>
      b.classList.toggle('on', b.dataset.id === id));
  }

  function DotField(height = 720) {
    let dots = '';
    for (let i = 0; i < 80; i++) {
      const x = (Math.sin(i * 9301 + 49297) * 233280 % 1 + 1) % 1 * 100;
      const y = (Math.sin(i * 9302 + 49297) * 233280 % 1 + 1) % 1 * 100;
      const r = 0.6 + ((Math.sin(i * 9303) + 1) / 2) * 1.4;
      const hue = (Math.sin(i * 9304) + 1) / 2;
      const color = hue < 0.4 ? '#A855F7' : hue < 0.8 ? '#22D3EE' : '#E8EEFA';
      const op = 0.15 + ((Math.sin(i * 9305) + 1) / 2) * 0.4;
      dots += `<circle cx="${x}" cy="${y}" r="${r * 0.12}" fill="${color}" opacity="${op}"/>`;
    }
    return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;">
      <defs>
        <radialGradient id="df1" cx="30%" cy="40%" r="55%"><stop offset="0%" stop-color="#A855F7" stop-opacity="0.22"/><stop offset="100%" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
        <radialGradient id="df2" cx="75%" cy="70%" r="55%"><stop offset="0%" stop-color="#22D3EE" stop-opacity="0.18"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="100" height="100" fill="url(#df1)"/>
      <rect width="100" height="100" fill="url(#df2)"/>
      ${dots}
    </svg>`;
  }

  function TitleSlide() {
    return `
      ${DotField()}
      <div style="position:absolute; inset: 120px 96px; display:flex; flex-direction:column; justify-content:space-between;">
        <img src="../assets/hardys/hardys-logo-transparent.png" style="height:48px; align-self:flex-start;"/>
        <div>
          <div class="eyebrow">INVESTOR PITCH · FALL 2026</div>
          <h1 style="font:400 88px/1.02 Georgia, serif; letter-spacing:-0.015em; margin:24px 0 0; color:#E8EEFA;">
            Every student deserves<br/>a <span class="grad-text">Hardy</span>.
          </h1>
          <div class="hairline" style="width:160px;margin-top:32px;"></div>
          <div style="font: italic 18px Georgia, serif; color:#94A3B8; margin-top:20px;">The Teaching Intelligence OS · A Juvant product</div>
        </div>
      </div>`;
  }

  function SectionSlide() {
    return `
      ${DotField()}
      <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:24px;">
        <div style="font: italic 120px/1 Georgia, serif;" class="grad-text">02</div>
        <div class="hairline" style="width:80px;"></div>
        <div class="eyebrow" style="letter-spacing:6px; font-size:13px;">THE PRODUCT THESIS</div>
        <div style="font: 400 44px/1.15 Georgia, serif; color:#E8EEFA; max-width:760px; text-align:center; margin-top:12px;">
          A second professor, in the room.
        </div>
      </div>`;
  }

  function ContentSlide() {
    return `
      <div style="position:absolute; inset: 72px 96px; display:grid; grid-template-columns: 1fr 1.4fr; gap: 64px;">
        <div>
          <div class="eyebrow">03 — THE PLATFORM</div>
          <h2 style="font:bold 36px/1.15 Georgia, serif; margin:20px 0 12px; color:#0D1117;">
            Six surfaces. One continuous Teaching Intelligence.
          </h2>
          <p class="body" style="margin:0; max-width: 380px;">
            Each surface is a named object in the platform — a proper noun, because each one does a specific thing.
          </p>
          <div style="margin-top:32px; font: 10px/1.6 Arial; color:#6b7280; letter-spacing:0.1em;">
            JUVANT · HARDYS · FALL 2026 · CONFIDENTIAL
          </div>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px; align-content:start;">
          ${[
            ['The Room','Virtual classroom · directly with students'],
            ['The Thread','Longitudinal learning memory'],
            ['The Mirror','Real-time teaching intelligence'],
            ['The Lens','Institutional dashboard'],
            ['The Bridge','Guest-speaker integration'],
            ['The Folio','Evolving student portrait'],
          ].map(([n, d]) => `
            <div style="background:#fff; border:1px solid rgba(13,17,23,0.08); border-radius:10px; padding:18px;">
              <div style="font:bold 20px/1.2 Georgia, serif; color:#0D1117;">${n}</div>
              <div style="font:13px/1.5 Arial; color:#6b7280; margin-top:6px;">${d}</div>
            </div>`).join('')}
        </div>
      </div>`;
  }

  function QuoteSlide() {
    return `
      ${DotField()}
      <div style="position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:0 160px; text-align:center;">
        <div style="font:italic 160px/1 Georgia, serif;" class="grad-text">"</div>
        <div class="quote" style="font-size:42px; line-height:1.2; max-width:920px; margin-top:-40px;">
          Intelligence already exists.<br/>Our agents help it <span class="grad-text" style="font-style:normal;">emerge</span>.
        </div>
        <div class="hairline" style="width:96px; margin-top:36px;"></div>
        <div class="eyebrow" style="margin-top:20px;">ANTONIO GATTI · FOUNDER, JUVANT SRLS</div>
      </div>`;
  }

  function CompareSlide() {
    const rows = [
      ['The status quo', 'Hardys'],
      ['Routes AI through the teacher', 'Interacts directly with students'],
      ['One session, one chat', 'Longitudinal, across semesters'],
      ['Generic assistant framing', 'A second professor'],
      ['Built for K-12 or mass-market', 'Built for senior faculty'],
    ];
    return `
      <div style="position:absolute; inset: 72px 96px;">
        <div class="eyebrow">04 — POSITIONING</div>
        <h2 style="font:400 42px/1.15 Georgia, serif; margin:16px 0 32px; color:#E8EEFA;">
          Every competitor routes AI through the teacher.
        </h2>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0; border-top: 1px solid rgba(232,238,250,0.1);">
          ${rows.map((r, i) => `
            <div style="padding:18px 20px; border-bottom: 1px solid rgba(232,238,250,0.06); ${i === 0 ? 'font-weight:bold; color:#94A3B8; font-size:11px; letter-spacing:0.2em; text-transform:uppercase;' : 'font:15px Arial; color:#94A3B8;'}">${r[0]}</div>
            <div style="padding:18px 20px; border-bottom: 1px solid rgba(232,238,250,0.06); border-left: 1px solid rgba(168,85,247,0.2); ${i === 0 ? 'font-weight:bold; font-size:11px; letter-spacing:0.2em; text-transform:uppercase;' : 'font:15px Arial;'} color:${i===0?'#22D3EE':'#E8EEFA'};">${r[1]}</div>
          `).join('')}
        </div>
      </div>`;
  }

  function ClosingSlide() {
    return `
      ${DotField()}
      <div style="position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:28px;">
        <img src="../assets/juvant/juvant-logo-transparent.png" style="height:64px;"/>
        <div class="hairline" style="width:120px;"></div>
        <div style="font:italic 22px Georgia, serif; color:#E8EEFA;">Talk to us.</div>
        <div style="font:14px/1.7 Arial; color:#94A3B8; text-align:center;">
          hello@juvant.io &nbsp;·&nbsp; juvant.io &nbsp;·&nbsp; Milan, Italy
        </div>
      </div>`;
  }

  // Build thumbnail track
  const track = document.getElementById('track');
  SLIDES.forEach(s => {
    const b = document.createElement('button');
    b.dataset.id = s.id; b.textContent = s.label;
    b.onclick = () => render(s.id);
    track.appendChild(b);
  });
  render(localStorage.getItem('juvant-slide') || 'title');
  window.addEventListener('resize', scaleStage);
</script>
</body>
</html>
