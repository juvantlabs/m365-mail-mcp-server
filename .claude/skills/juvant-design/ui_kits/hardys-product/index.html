<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Hardys — Teaching Intelligence OS</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<link rel="stylesheet" href="../juvant-corporate/primitives.jsx" as="script">
<style>
  html, body { margin: 0; padding: 0; background: #080B14; color: #E8EEFA;
    font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: inherit; }
  /* Shared scrollbar polish for dark UI */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(232,238,250,0.08); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(232,238,250,0.16); }
  /* Switcher pill (top-right overlay) */
  .hd-switcher {
    position: fixed; top: 14px; right: 14px; z-index: 100;
    display: flex; gap: 2px; padding: 4px;
    background: rgba(8,11,20,0.85); backdrop-filter: blur(10px);
    border: 1px solid rgba(232,238,250,0.08); border-radius: 999px;
    font-family: var(--font-sans); font-size: 12px;
  }
  .hd-switcher button {
    background: transparent; border: 0; padding: 6px 14px; border-radius: 999px;
    color: #94A3B8; cursor: pointer; font-weight: 600; letter-spacing: 0.02em;
  }
  .hd-switcher button.on {
    background: linear-gradient(90deg,#A855F7,#22D3EE); color: #fff;
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="../juvant-corporate/primitives.jsx"></script>
<script type="text/babel" src="hardys-primitives.jsx"></script>
<script type="text/babel" src="Marketing.jsx"></script>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="Screens.jsx"></script>
<script type="text/babel">
  const VIEWS = ['Marketing', 'Room', 'Mirror', 'Lens', 'Folio'];
  const LS_KEY = 'hardys-ui-kit-view';

  const App = () => {
    const [view, setView] = React.useState(() => localStorage.getItem(LS_KEY) || 'Marketing');
    React.useEffect(() => { localStorage.setItem(LS_KEY, view); }, [view]);

    let body;
    if (view === 'Marketing') body = <Marketing/>;
    else {
      const screens = { Room: RoomScreen, Mirror: MirrorScreen, Lens: LensScreen, Folio: FolioScreen };
      const S = screens[view];
      body = <AppShell active={view.toLowerCase()} onNav={(id) => setView(id[0].toUpperCase() + id.slice(1))}><S/></AppShell>;
    }
    return (
      <>
        <div className="hd-switcher" data-screen-label="view-switcher">
          {VIEWS.map(v => (
            <button key={v} className={v === view ? 'on' : ''} onClick={() => setView(v)}>{v}</button>
          ))}
        </div>
        <div data-screen-label={`hardys-${view.toLowerCase()}`}>{body}</div>
      </>
    );
  };
  ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
