<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Juvant — Augmenting human ingenuity</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  @font-face {
    font-family: 'DejaVu Sans Condensed';
    font-weight: 700;
    font-style: normal;
    font-display: swap;
    src: url('../../fonts/DejaVuSansCondensed-Bold.ttf') format('truetype');
  }
  html, body { margin: 0; padding: 0; background: #080B14; color: #E8EEFA;
    font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: inherit; }
  .jv-eyebrow { font-family: var(--font-sans); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.22em; color: #A855F7; }
  .jv-gradient-text {
    background: linear-gradient(90deg, #A855F7 0%, #22D3EE 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .jv-wordmark {
    font-family: 'DejaVu Sans Condensed', 'Arial Narrow', sans-serif;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: linear-gradient(90deg, #A855F7 0%, #22D3EE 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Sections.jsx"></script>
<script type="text/babel">
  const App = () => (
    <>
      <Nav/>
      <Hero/>
      <Thesis/>
      <Portfolio/>
      <Philosophy/>
      <Contact/>
      <Footer/>
    </>
  );
  ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
